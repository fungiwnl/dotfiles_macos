- defaults:
    link:
      relink: true

- clean: ["~"]

- link:
    ~/.p10k.zsh: .p10k.zsh
    ~/.zshrc: .zshrc
    ~/zshrc: zshrc
    ~/.gitconfig:
    ~/.hammerspoon: .config/hammerspoon
    ~/.config/aerospace: .config/aerospace
    ~/.config/ghostty: .config/ghostty
    ~/.config/sketchybar: .config/sketchybar
    ~/.config/spicetify: .config/spicetify
    ~/.tmux.conf: .config/tmux/.tmux.conf
    ~/.config/nvim: .config/nvim
    ~/.claude/settings.json: .config/claude/settings.json
    ~/.bunfig.toml: .config/bun/bunfig.toml
    ~/.config/uv/uv.toml: .config/uv/uv.toml
    ~/Library/Preferences/pnpm/config.yaml: .config/pnpm/config.yaml
    ~/.ssh/:
      glob: true
      path: certs/*.pem

- create:
    - ~/.claude
    - ~/.config
    - ~/.config/sketchybar
    - ~/.config/uv
    - ~/Library/Preferences/pnpm
    - ~/dev

- shell:
    - command: [zsh macos, Setting macOS settings]
      stdout: true
      stderr: true
    - command: [git submodule update --init --recursive, Installing submodules]
      stdout: true
      stderr: true
    - command: [git config core.hooksPath .githooks, Enabling repo git hooks]
      stdout: true
      stderr: true
    - command: [zsh scripts/setup_homebrew.zsh, Installing homebrew]
      stdout: true
      stderr: true
    - command: [bash scripts/setup_tmux_plugins.sh, Installing tmux plugins]
      stdout: true
      stderr: true
    - command: [zsh scripts/setup_gcloud.zsh, Installing Google Cloud CLI]
      stdout: true
      stderr: true
    - command: [zsh -i scripts/setup_ssh.zsh, Setting up SSH]
      stdout: true
      stderr: true
    - command: [bash -i scripts/setup_npmrc.sh, Setting up .npmrc]
      stdout: true
      stderr: true
    - command: [if test -f scripts/setup_repos.zsh; then zsh scripts/setup_repos.zsh; fi, Cloning repos]
      stdout: true
      stderr: true
    - command: [if command -v spicetify >/dev/null 2>&1; then spicetify backup apply; fi, Applying Spicetify]
      stdout: true
      stderr: true
